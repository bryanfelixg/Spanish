    phrases:
      - spanish: Las sábanas están limpias.
        english: The sheets are clean.
      - spanish: La camisa está en el clóset.
        english: The shirt is in the closet.
      - spanish: Apaga la lámpara, por favor.
        english: Turn off the lamp, please.
      - spanish: Pongo el despertador a las siete.
        english: I set the alarm clock for seven.
      - spanish: Necesito otra cobija.
        english: I need another blanket.
      - spanish: Los calcetines están sucios.
        english: The socks are dirty.
      - spanish: ¿Dónde están mis zapatos?
        english: Where are my shoes?
      - spanish: Tengo sueño.
        english: I am sleepy.
      - spanish: Quiero mi almohada.
        english: I want my pillow.
      - spanish: La pijama está en la cama.
        english: The pajamas are on the bed.
      - spanish: Necesito un gancho.
        english: I need a hanger.
      - spanish: Los pantalones están en la cómoda.
        english: The pants are in the dresser.
