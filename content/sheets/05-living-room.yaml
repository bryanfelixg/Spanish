    phrases:
      - spanish: ¿Dónde está el control remoto?
        english: Where is the remote control?
      - spanish: Leo un libro en el sofá.
        english: I read a book on the sofa.
      - spanish: Abre las cortinas, por favor.
        english: Open the curtains, please.
      - spanish: La planta está aquí.
        english: The plant is here.
      - spanish: Enciende el ventilador, por favor.
        english: Turn on the fan, please.
      - spanish: Apaga el televisor, por favor.
        english: Turn off the TV, please.
      - spanish: El cojín está en el sofá.
        english: The cushion is on the sofa.
      - spanish: La alfombra está limpia.
        english: The rug is clean.
      - spanish: El libro está en el estante.
        english: The book is on the shelf.
      - spanish: La ventana está abierta.
        english: The window is open.
      - spanish: El sillón es cómodo.
        english: The armchair is comfortable.
      - spanish: Cierra la puerta, por favor.
        english: Close the door, please.
