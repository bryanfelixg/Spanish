    phrases:
      - spanish: ¿Hay leche?
        english: Is there any milk?
      - spanish: Quiero agua, por favor.
        english: I would like water, please.
      - spanish: Lava la manzana, por favor.
        english: Wash the apple, please.
      - spanish: Necesito dos tomates.
        english: I need two tomatoes.
      - spanish: ¿Dónde están las sobras?
        english: Where are the leftovers?
      - spanish: ¿Me pasas el queso?
        english: Could you pass me the cheese?
      - spanish: El yogur está frío.
        english: The yogurt is cold.
      - spanish: Quiero un huevo.
        english: I want an egg.
      - spanish: No hay mantequilla.
        english: There is no butter.
      - spanish: Me gustan las uvas.
        english: I like grapes.
      - spanish: ¿Quieres jugo?
        english: Do you want juice?
      - spanish: El pollo está en el refrigerador.
        english: The chicken is in the refrigerator.
