    phrases:
      - spanish: Necesito un plato.
        english: I need a plate.
      - spanish: ¿Me pasas una cuchara?
        english: Could you pass me a spoon?
      - spanish: ¿Dónde está el tenedor?
        english: Where is the fork?
      - spanish: El vaso está limpio.
        english: The glass is clean.
