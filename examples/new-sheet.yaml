    phrases:
      - spanish: Quiero leer un libro.
        english: I want to read a book.
      - spanish: Enciende la lámpara, por favor.
        english: Turn on the lamp, please.
      - spanish: Pon el libro en el estante.
        english: Put the book on the shelf.
      - spanish: Escribo en el cuaderno.
        english: I write in the notebook.
      - spanish: Abre las cortinas, por favor.
        english: Open the curtains, please.
      - spanish: Mi teléfono está aquí.
        english: My phone is here.
      - spanish: Necesito una cobija.
        english: I need a blanket.
      - spanish: El cojín está en el sillón.
        english: The cushion is on the armchair.
      - spanish: Quiero agua, por favor.
        english: I would like water, please.
      - spanish: La taza está en la mesa.
        english: The cup is on the table.
      - spanish: ¿Me prestas un bolígrafo?
        english: Could you lend me a pen?
      - spanish: La planta está en la ventana.
        english: The plant is at the window.
